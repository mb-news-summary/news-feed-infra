# helm/platform/efk/kibana-values-dev.yaml
#
# Kibana connects to Elasticsearch over HTTPS using the auto-generated
# elastic password from the `elasticsearch-master-credentials` secret.
# SSL certificate verification is disabled (self-signed cert in dev).

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi

replicas: 1

# ---------------------------------------------------------------------------
# Elasticsearch connection — HTTPS with credentials
# ---------------------------------------------------------------------------
elasticsearchHosts: "https://elasticsearch-master:9200"

# Inject the elastic password from the secret the ES chart creates.
# No explicit credentials needed — the chart's manage-es-token.js hook
# creates a service account token via the ES API on install/upgrade and
# stores it in a K8s secret. Kibana uses that token automatically.

service:
  type: ClusterIP
  port: 5601

ingress:
  enabled: true
  ingressClassName: traefik
  hosts:
    - host: kibana.marianbodnar.uk
      paths:
        - path: /
  tls:
    - secretName: kibana-tls
      hosts:
        - kibana.marianbodnar.uk
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"

kibanaConfig:
  kibana.yml: |
    server.name: kibana
    server.host: "0.0.0.0"
    # Self-signed cert in dev — skip verification.
    elasticsearch.ssl.verificationMode: none
    telemetry.optIn: false
    telemetry.enabled: false

healthCheckPath: "/app/kibana"

readinessProbe:
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 10
