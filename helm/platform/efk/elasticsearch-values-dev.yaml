# helm/platform/efk/elasticsearch-values-dev.yaml
#
# ES 8.x runs with security (HTTPS + authentication) enabled by default.
# We accept this and configure Kibana and Fluent Bit to connect securely.
# The chart auto-generates the elastic password in the
# `elasticsearch-master-credentials` secret — Kibana and Fluent Bit read it
# from there via extraEnvs.

replicas: 1
minimumMasterNodes: 1

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

esJavaOpts: "-Xmx512m -Xms512m"

volumeClaimTemplate:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi

service:
  type: ClusterIP

httpPort: 9200
transportPort: 9300

sysctlInitContainer:
  enabled: true

antiAffinity: "soft"
