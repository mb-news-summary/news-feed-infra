# helm/platform/efk/fluent-bit-values-dev.yaml
#
# Fluent Bit — lightweight log collector (DaemonSet, one pod per node).
# Ships container logs to Elasticsearch over HTTPS using the elastic password.

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

# Inject the elastic password from the ES chart's generated secret.
env:
  - name: ELASTIC_PASSWORD
    valueFrom:
      secretKeyRef:
        name: elasticsearch-master-credentials
        key: password

config:
  service: |
    [SERVICE]
        Daemon        Off
        Flush         5
        Log_Level     info
        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020
        Health_Check  On

  inputs: |
    [INPUT]
        Name              tail
        Tag               kube.*
        Path              /var/log/containers/*.log
        Parser            cri
        DB                /var/log/flb_kube.db
        Mem_Buf_Limit     10MB
        Skip_Long_Lines   On
        Refresh_Interval  10

  filters: |
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix     kube.var.log.containers.
        Merge_Log           On
        Merge_Log_Key       log_processed
        Keep_Log            Off
        K8S-Logging.Parser  On
        K8S-Logging.Exclude Off
        Labels              On
        Annotations         Off

    [FILTER]
        Name    modify
        Match   kube.*
        Remove  stream
        Remove  _p

  outputs: |
    [OUTPUT]
        Name              es
        Match             kube.*
        Host              elasticsearch-master
        Port              9200
        Logstash_Format   On
        Logstash_Prefix   fluent-bit
        Replace_Dots      On
        Suppress_Type_Name On
        Retry_Limit       3
        HTTP_User         elastic
        HTTP_Passwd       ${ELASTIC_PASSWORD}
        tls               On
        tls.verify        Off

  customParsers: |
    [PARSER]
        Name        cri
        Format      regex
        Regex       ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z

tolerations:
  - operator: Exists
