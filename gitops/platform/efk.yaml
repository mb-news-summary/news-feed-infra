# Logging stack: Loki (log storage) + Promtail (log collector DaemonSet)
# Replaces the EFK stack. Logs are viewed in Grafana — no Kibana needed.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  sources:
    - repoURL: https://helm.grafana.com
      chart: loki
      targetRevision: "6.x"
      helm:
        releaseName: loki
        valueFiles:
          - $values/helm/platform/loki/values-dev.yaml
    - repoURL: https://github.com/mb-news-summary/news-feed-infra.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: promtail
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  sources:
    - repoURL: https://helm.grafana.com
      chart: promtail
      targetRevision: "6.x"
      helm:
        releaseName: promtail
        valueFiles:
          - $values/helm/platform/promtail/values-dev.yaml
    - repoURL: https://github.com/mb-news-summary/news-feed-infra.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
