# environments/dev/env.yaml
environment: "dev"
folder_id: "795926127355"

# GKE settings
gke_min_node_count: 1
gke_max_node_count: 3
machine_type: "e2-standard-2"

# Zonal cluster — cheaper for dev. Pick a zone in your default_region.
# europe-west1 has zones: europe-west1-b, europe-west1-c, europe-west1-d
gke_zone: "europe-west1-b"

# Your public IP for kubectl access.
# Find it with:  curl -s https://icanhazip.com
# Then set it here as "X.X.X.X/32"
master_authorized_cidr: "128.127.126.95/32"
