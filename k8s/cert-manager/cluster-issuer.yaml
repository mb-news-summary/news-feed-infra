# k8s/cert-manager/cluster-issuer.yaml
#
# ClusterIssuer tells cert-manager HOW to get certificates:
#   - From whom: Let's Encrypt (production)
#   - How to prove ownership: Cloudflare DNS-01 challenge
#   - API access: via the cloudflare-api-token K8s secret
#
# Apply this AFTER cert-manager is running (CRDs must exist first):
#   kubectl apply -f k8s/cert-manager/cluster-issuer.yaml
#
# Replace youremail@example.com with your actual email.
# Let's Encrypt uses it to notify you about certificate expiry.

apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    # Let's Encrypt production endpoint — issues real trusted certs.
    # Use https://acme-staging-v02.api.letsencrypt.org/directory for testing
    # (staging has much higher rate limits but issues untrusted certs).
    server: https://acme-v02.api.letsencrypt.org/directory

    # Your email — Let's Encrypt sends expiry warnings here.
    email: bodnarmarian14@gmail.com

    # Where cert-manager stores the ACME account private key.
    privateKeySecretRef:
      name: letsencrypt-prod-account-key

    solvers:
      - dns01:
          cloudflare:
            # The K8s Secret you created imperatively (not in git).
            # Secret name: cloudflare-api-token
            # Secret key:  api-token
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
